<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <main class="auth-container">

    <section class="auth-brand">

      <div class="brand-icon">
        💬
      </div>

      <h1>Welcome back</h1>

      <p>
        Sign in to chat, call and play with your friends.
      </p>

    </section>


    <section class="auth-card">

      <form id="loginForm">

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <div class="password-label">

            <label for="password">
              Password
            </label>

            <a href="#" class="small-link">
              Forgot password?
            </a>

          </div>


          <div class="password-input">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <div
          id="loginError"
          class="form-message error-message"
        ></div>


        <button
          type="submit"
          class="primary-button"
          id="loginButton"
        >
          Login
        </button>

      </form>


      <div class="auth-divider">

        <span></span>

        <p>OR</p>

        <span></span>

      </div>


      <p class="auth-footer">

        Don't have an account?

        <a href="signup.html">
          Create account
        </a>

      </p>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
